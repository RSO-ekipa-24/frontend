apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.deployment.name }}
  annotations:
    cloud.google.com/backend-config: '{"default": "frontend-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  replicas: {{ .Values.frontend.deployment.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.deployment.image.repository }}:{{ .Values.frontend.deployment.image.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.deployment.image.containerPort }}

          startupProbe:
            httpGet:
              path: /q/health/started
              port:  {{ .Values.frontend.deployment.image.containerPort }}
            initialDelaySeconds: 15
            failureThreshold: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /q/health/live
              port:  {{ .Values.frontend.deployment.image.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /q/health/ready
              port:  {{ .Values.frontend.deployment.image.containerPort }}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service.serviceName }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
  selector:
    app: frontend