<app-fluid-layout>
  <app-page-header [title]="'General.Pages.Properties' | translate">
    <ng-template #toolbar>
      <p-splitbutton
        styleClass="right-align-dropdown"
        menuStyleClass="text-sm p-1 mt-2"
        label="{{ 'General.Buttons.Actions' | translate }}"
        appendTo="body"
        [model]="gridActions()"
        size="small"/>
    </ng-template>
  </app-page-header>

  <app-property-grid class="flex-grow"></app-property-grid>
</app-fluid-layout>

<app-property-dialog
  [(visible)]="addPropertyDialogVisible"
></app-property-dialog>
