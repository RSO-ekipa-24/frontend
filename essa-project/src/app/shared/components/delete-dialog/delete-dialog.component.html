<p-dialog
  [header]="header()"
  [(visible)]="isVisible"
  [draggable]="false"
  [resizable]="false"
  [modal]="true"
  [breakpoints]="{ '1199px': '50vw', '575px': '50vw' }"
  [style]="{ width: '30vw' }"
  (onHide)="onHide()"
>
  {{ body() }}

  <ng-template #footer>
    <p-button
      [label]="'General.Buttons.Cancel' | translate"
      severity="secondary"
      size="small"
      (onClick)="onHide()"
    ></p-button>
    <p-button
      [label]="'General.Buttons.Delete' | translate"
      size="small"
      severity="danger"
      (onClick)="onDeleteClick()"
    ></p-button>
  </ng-template>
</p-dialog>
