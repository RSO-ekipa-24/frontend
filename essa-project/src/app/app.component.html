<div class="flex flex-col h-screen">

  @if (!isAdminRoute) {
    <app-navbar class="flex z-10"></app-navbar>
  }

  <!-- Content Container -->
  <div class="flex flex-1">
    @if (isAdminRoute) {
      <app-sidebar></app-sidebar>
    }

    <!-- Main Content -->
    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>

  @if (!isAdminRoute) {

  }
</div>

<p-toast key="global-toast"></p-toast>
