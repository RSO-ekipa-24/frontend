name: CI/CD Pipeline for Frontend service

permissions:
  contents: 'read'
  id-token: 'write'

on:
  push:
    branches: [ dev ]

env:
  PROJECT_ID: 'artful-reactor-351917'
  GAR_LOCATION: 'europe-central2'
  DEPLOYMENT_NAME: 'frontend-release'
  REPOSITORY: 'essa-images'
  IMAGE: 'frontend-app'
  WORKING_DIR: './essa-project'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      # --- ADDING UNIT TESTS HERE ---
      - name: Run Unit Tests
        working-directory: ${{ env.WORKING_DIR }}
        # Runs headless so it doesn't try to open a window on the server
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build Angular App
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build -- --configuration production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          # Points to where Angular builds the files
          path: ${{ env.WORKING_DIR }}/dist/

  docker-build-push:
    name: Build Docker & Push
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.WORKING_DIR }}/dist/

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/881557273122/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: github-actions-account@artful-reactor-351917.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          # -f points to the Dockerfile inside essa-project
          # The last argument (./essa-project) is the context
          docker build \
            -f ${{ env.WORKING_DIR }}/Dockerfile \
            -t "$IMAGE_TAG" \
            ${{ env.WORKING_DIR }}
          docker push "$IMAGE_TAG"