name: CI/CD Pipeline for Frontend service

permissions:
  contents: 'read'
  id-token: 'write'

on:
  push:
    branches: [ dev ]

env:
  PROJECT_ID: 'artful-reactor-351917'
  GAR_LOCATION: 'europe-central2'

  DEV_CLUSTER: 'essa-cluster'
  DEV_ZONE: 'europe-central2'

  DEPLOYMENT_NAME: 'frontend-release'
  REPOSITORY: 'essa-images'
  IMAGE: 'frontend-app'
  WORKING_DIR: './essa-project'

jobs:
  build-and-push:
    name: Test, Build, and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Run Unit Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build Angular App
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build -- --configuration production

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/881557273122/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: github-actions-account@artful-reactor-351917.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker build \
            -f ${{ env.WORKING_DIR }}/Dockerfile \
            -t "$IMAGE_TAG" \
            ${{ env.WORKING_DIR }}
          docker push "$IMAGE_TAG"

  deploy-dev:
    name: Deploy to DEV (Helm)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Gatekeeper: Only deploy when pushing to the dev branch
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/881557273122/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: github-actions-account@artful-reactor-351917.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.DEV_CLUSTER }}
          location: ${{ env.DEV_ZONE }}

      - name: Deploy Helm Chart to DEV
        run: |
          helm upgrade --install ${{ env.DEPLOYMENT_NAME }} ../../deploy/k8s/charts/frontend-chart \
            --set frontend.deployment.image.repository="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}" \
            --set frontend.deployment.image.tag="${{ github.sha }}" \
            --namespace essa-project